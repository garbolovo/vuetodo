<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.5.16/dist/vue.js"></script>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  <div id="header">
    <h3>Todo App</h3>
  </div>

  <div id="app">
    <p>{{ name }}<p> <p>ПРЕДСТАВЛЯЕТ</p>
    <button @click="changeName">Change Name</button>
    <input type="text" id="search-todo" @keyup="filterTodo" placeholder="Search">

    <div id="enter-todo">
      <label for="todo">Task Title </label><input id="todo" type="text">
      <label for="todo-body">Task Body </label><textarea id="todo-body" type="text" rows="8"></textarea>
      <label for="todo-due">Due Date </label><input id="todo-due" type="date">
      <button id="todo-btn" @click="regTodo">Add Todo</button>
    </div>

    <div id="todo-list-wrapper">
      <div class="todo-row" v-for="entry in displayEntries" :key="entry.item.id" :style="{ paddingLeft: (14 + entry.depth * 22) + 'px' }">
        <div class="todo-row-main">
          <span class="disclosure" v-if="entry.hasChildren" @click="toggleCollapse(entry.item.id)">{{ entry.item.collapsed ? '▸' : '▾' }}</span>
          <span class="disclosure-spacer" v-else></span>

          <input type="checkbox" class="todo-check" :checked="entry.item.done" @change="doneTodo(entry.item.id)">

          <span class="todo-title" :class="{ done: entry.item.done }" @click="editTitle(entry.item.id, entry.item.title)">{{ entry.item.title }}</span>

          <span class="due-badge" v-bind:class="dueDateClass(entry.item.dueDate)" v-if="entry.item.dueDate">{{ dueDateLabel(entry.item.dueDate) }}</span>

          <button class="btn-add-sub" title="Add subtask" @click="addSubtask(entry.item.id)">+</button>
          <button class="btn-delete-todo-elem" title="Delete" @click="deleteTodo(entry.item.id)">×</button>
        </div>
        <p class="todo-body" v-if="entry.item.body" @click="editBody(entry.item.id, entry.item.body)">{{ entry.item.body }}</p>
      </div>
    </div>

    <p id="num">You have {{ num }} tasks incomplete yet</p>

  </div>
  <script src="uuidv4.js"></script>
<script src="app.js"></script>
</body>
</html>
